<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View single PDF</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">


  <style>
    .navbar {
      background-color : #dfe2ec !important;
    }
    .navbar-nav .nav-link {
      font-size: 1.2rem; /* zväčšenie písma */
      margin-right: 20px; /* medzera medzi položkami */
      color: rgb(51, 102, 255); /* farba textu v menu */
    }

    /* Zmena farby pri hover */
    .navbar-nav .nav-link:hover {
      color: #00134d;
    }

    .navbar-nav .nav-link.active {
      color: rgb(51, 102, 255) !important; /* prepíše bootstrap čiernu */
    }

    .navbar-nav .nav-link.active:hover {
      color: #00134d !important;
    }

  </style>

</head>

<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" href="/upload">Article Processor</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="/upload">Upload</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/view">View all</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/">About project</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Page Heading -->
<div class="container mt-4">
  <h2>Title: <br><span th:text="${docTitle}"></span></h2> <!-- title aktuálneho dokumentu -->

  <div class="row mt-4">
    <!-- Left Column: Text Info -->
    <div class="col-md-6">
      <h3>Information about Document</h3>
      <p>Category: <span th:text="${category}"></span></p>
      <p>Author: <span th:text="${author}"></span></p>
      <p>Publication year: <span th:text="${year}"></span></p>
      <p>DOI: <span th:text="${doi}"></span></p>
      <p>Link: <span th:text="${link}"></span></p>

      <h3 class="mt-4">References:</h3>
      <div class="table-responsive">
        <table class="table table-bordered table-striped">
          <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Status</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="ref: ${references}">
            <td th:text="${ref.id}"></td>
            <td><a th:href="@{'/view/' + ${ref.id}}" th:text="${ref.title}"></a></td>
            <td th:text="${ref.status}">-</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Right Column: PDF -->
    <div class="col-md-6">
      <div id="pdf-container" class="mb-4">
        <embed th:src="@{'/api/documents/' + ${documentId} + '/content'}" type="application/pdf" width="100%" height="1000px"/>
      </div>
    </div>
  </div>
</div>

<footer class="footer bg-light mt-5">
  <div class="container text-center">
    <p class="text-muted small">&copy; Eliška Kozáčiková 2025. All Rights Reserved.</p>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
