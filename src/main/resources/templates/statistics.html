<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Document Statistics</title>
    <script src="https://cdn.plot.ly/plotly-1.58.5.min.js"></script>

    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,300italic,400italic,700italic" rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/styles.css}" />

    <style>
        .navbar-nav .nav-link {
            font-size: 1.2rem;
            margin-right: 20px;
            color: rgb(51, 102, 255);
        }

        .navbar-nav .nav-link:hover {
            color: #00134d;
        }

        .navbar-nav .nav-link.active {
            color: rgb(51, 102, 255) !important;
        }

        .navbar-nav .nav-link.active:hover {
            color: #00134d !important;
        }

        h2 {
            color: #ffffff;
            text-align: center;
            margin-top: 30px;
        }

        .chart-container {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        .chart-box {
            flex: 1;
            min-width: 400px;
            height: 500px;
            background-color: #6780a3;
            border-radius: 12px;
            padding: 15px;
            overflow: hidden;
        }

        .chart-box:hover {
            transform: scale(1.01);
            transition: transform 0.2s ease-in-out;
        }

        .chart-box .js-plotly-plot {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;  /* natiahne graf presne na šírku boxu */
            height: 100% !important; /* natiahne graf presne na výšku boxu */
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light static-top">
    <div class="container">
        <a class="navbar-brand" href="/upload">Article Processor</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/upload">Upload</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/view">View all</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/statistics">Statistics</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/upload">About project</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Page Content -->
<header class="masthead">
    <div class="container position-relative">
        <div class="row justify-content-center">
            <div class="col-xl-8">
                <div class="text-center text-white">
                    <h1 class="mb-4">📊 Document Statistics</h1>
                </div>
            </div>
        </div>
    </div>
</header>


<div class="container mt-5">
    <div class="chart-container">
        <div id="statusChart" class="chart-box"></div>
        <div id="categoryChart" class="chart-box"></div>
    </div>
</div>

<script th:inline="javascript">
    const statusData = [[${statusCount}]];
    const categoryData = [[${categoryCount}]];

    const statusLabels = Object.keys(statusData);
    const statusValues = Object.values(statusData);

    const categoryLabels = Object.keys(categoryData);
    const categoryValues = Object.values(categoryData);

    // 🟡 PIE chart (animated)
    const pieTrace = {
        type: 'pie',
        labels: statusLabels,
        values: statusValues.map(() => 0),
        hole: 0.3,
        marker: {
            colors: ['#1c375e', '#d4af37', '#66ccff', '#ffff66']
        }
    };

    const pieLayout = {
        title: 'Documents by Status',
        paper_bgcolor: '#6780a3',
        font: { color: '#ffffff' }
    };

    Plotly.newPlot('statusChart', [pieTrace], pieLayout, { responsive: true })
        .then(() => {
        let step = 0;
        const totalSteps = 60;

        const animate = () => {
            step++;
            const interpolatedValues = statusValues.map(v => v * (step / totalSteps));
            Plotly.restyle('statusChart', { values: [interpolatedValues] });

            if (step < totalSteps) {
                setTimeout(animate, 15);
            }
        };

        animate();
    });

    // 🔵 BAR chart (animated)
    const maxY = Math.max(...categoryValues);
    const traceBar = {
        type: 'bar',
        x: categoryLabels,
        y: categoryValues.map(() => 0),
        marker: {
            color: 'rgba(102, 255, 204, 0.7)',
            line: { color: '#66ffff', width: 1.5 }
        }
    };

    const layoutBar = {
        title: 'Documents by Category',
        paper_bgcolor: '#6780a3',
        plot_bgcolor: '#6780a3',
        font: { color: '#ffffff' },
        xaxis: {
            title: '',
            tickangle: -45,
            automargin: true
        },
        yaxis: {
            title: 'Count',
            range: [0, maxY * 1.1]
        }
    };

    Plotly.newPlot('categoryChart', [traceBar], layoutBar, { responsive: true })
        .then(() => {
        const update = { data: [{ y: categoryValues }] };
        setTimeout(() => {
            Plotly.animate('categoryChart', update, {
                frame: { duration: 800, redraw: true },
                transition: { duration: 500, easing: 'cubic-in-out' }
            });
        }, 500);
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<footer class="footer bg-light mt-5">
    <div class="container text-center">
        <p class="text-muted small">&copy; Eliška Kozáčiková 2025. All Rights Reserved.</p>
    </div>
</footer>
</body>
</html>
